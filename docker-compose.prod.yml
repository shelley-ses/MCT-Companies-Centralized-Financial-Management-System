services:
  # ─── NGINX Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mct_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - mct_network
    restart: always

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mct_backend_prod
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    networks:
      - mct_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── React Frontend Builder ─────────────────────────────────────────────────
  frontend_builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: mct_frontend_builder
    volumes:
      - frontend_build:/app/dist
    networks:
      - mct_network

volumes:
  frontend_build:

networks:
  mct_network:
    driver: bridge
